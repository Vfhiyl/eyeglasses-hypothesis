# Prefer env vars or config/rete_api.local.yaml for live sessions.
# Modern RCT effect sizes — OUTCOMES ARE NOT COMMENSURABLE; never merge into one %-range.

studies:
  - name: PROSPER
    location: Assam, India
    population: tea pickers
    outcome: daily_tea_plucked_weight
    outcome_label: relative productivity (tea weight)
    effect_pct: 21.7
    ci_lower: 17.0
    ci_upper: 26.4
    reference: "Lancet Glob Health 2018; PubMed 30049615; doi:10.1016/S2214-109X(18)30329-2"
    year: 2018
    scenario: moderate_productivity
    commensurable_with_productivity: true

  - name: PROSPER_II
    location: Karnataka, India
    population: garment factory workers
    outcome: workplace_productivity
    outcome_label: relative productivity (garment work)
    effect_pct: 5.7
    ci_lower: 1.04
    ci_upper: 10.4
    reference: "Br J Ophthalmol 2025; doi:10.1136/bjo-2025-328563; PubMed 42045075"
    year: 2025
    scenario: conservative_productivity
    commensurable_with_productivity: true

  - name: THRIVE
    location: Bangladesh
    population: rural near-work occupations
    outcome: self_reported_monthly_income
    outcome_label: self-reported monthly income (NOT direct productivity)
    effect_pct: 33.4
    ci_lower: null
    ci_upper: null
    reference: "PLOS ONE 2024; doi:10.1371/journal.pone.0296115"
    year: 2024
    scenario: income_not_productivity
    commensurable_with_productivity: false
    note: "Endpoint is median income difference between arms; do not cite as productivity %"

# Historical simulation still uses productivity deltas only (exclude THRIVE income)
presbyopia:
  onset_age: 40
  peak_impact_age: 50
  full_impact_age: 55

scenarios:
  conservative:
    delta: 0.057
    source: PROSPER_II
  moderate:
    delta: 0.217
    source: PROSPER
  # optimistic uses PROSPER upper CI side, NOT THRIVE income
  optimistic:
    delta: 0.264
    source: PROSPER_upper_ci_proxy
